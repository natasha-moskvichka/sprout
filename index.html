<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Росток</title>
    <meta name="viewport" content="width=device-width, initial-scale=1 viewport-fit=cover">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<header class="header">
    <h1 class="header__title">Росток 🌿</h1>
    <button type="button" class="btn btn__toggle-theme" aria-label="Переключить тему"></button>
</header>

<main class="main">
    <div class="content">
        <!-- Блок подборщик -->
        <div class="quiz__banner">
            <h2>Не знаете, какое растение выбрать?</h2>
            <p>Пройдите короткий тест, и мы подберем идеальный цветок под ваше освещение и образ жизни!</p>
            <button type="button" class="btn btn__quiz">Подобрать растение</button>
        </div>

        <!-- Блок Поиска по названию -->
        <div class="search__wrapper">
            <input type="text" class="search__input" placeholder="Введите название (например, Monstera)..." inputmode="search">
            <button type="button" class="btn btn__search">Искать 🔎</button>
        </div>

        <!-- Контейнер для карточек, которые прилетят от сервера -->
        <div class="search__results"></div>
    </div>

    <div class="modal hidden">
        <div class="modal__card">
            <h2 class="modal__title">Подбор идеального растения</h2>
            <ul class="modal__list">
                <li class="modal__list-item">
                    <input type="radio" name="environment" id="type-light" value="bright" checked>
                    <label for="type-light">Яркий свет</label>
                </li>
                <li class="modal__list-item">
                    <input type="radio" name="environment" id="type-dark" value="shadow">
                    <label for="type-dark">Тень</label>
                </li>
            </ul>
            <ul class="modal__list">
                <li class="modal__list-item">
                    <input type="radio" name="pets" id="type-pets" value="safe">
                    <label for="type-pets">Есть питомцы (нужны безопасные растения)</label>
                </li>
                <li class="modal__list-item">
                    <input type="radio" name="pets" id="type-no-pets" value="danger" checked>
                    <label for="type-no-pets">Нет питомцев</label>
                </li>
            </ul>
            <div class="modal__actions">
                <button type="button" class="btn modal__btn-cancel">Отмена</button>
                <button type="button" class="btn modal__btn-save">Сохранить</button>
            </div>
        </div>
    </div>
</main>

<script src="app.js" type="module"></script>

</body>
</html>
